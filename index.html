<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kartei">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kartei</title>
<style>
:root{
  --bg:#f2f2f7; --surface:#fff; --surface2:#f6f6f9; --text:#16161a; --muted:#6c6c78; --line:#e2e2e9;
  --accent:#4f46e5; --accent-soft:#ecebff; --on-accent:#fff;
  --gray:#cfcfd8; --green:#34c759; --green-dark:#13803a; --orange:#ff9500; --red:#ff3b30;
  --hl:rgba(52,199,89,.30); --hl-text:#0b6b2c;
  --lv0:#bdbdc8; --lv1:#ff3b30; --lv2:#ff9500; --lv3:#a5d63f; --lv4:#34c759; --lv5:#13803a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 24px rgba(0,0,0,.07);
  --radius:18px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0f12; --surface:#1c1c21; --surface2:#25252c; --text:#f2f2f6; --muted:#9a9aa8; --line:#2f2f38;
    --accent:#8b85ff; --accent-soft:#2a2850; --on-accent:#0f0f12;
    --gray:#4a4a55; --green:#30d158; --green-dark:#1fa34a; --orange:#ff9f0a; --red:#ff453a;
    --hl:rgba(48,209,88,.28); --hl-text:#7ef0a0;
    --lv0:#5a5a66; --lv5:#1fa34a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- generic layout ---------- */
.page{padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 96px);max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}
.topbar .grow{flex:1;min-width:0}
.big-title{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-size:22px}
.icon-btn:active{background:var(--accent-soft)}
.text-btn{color:var(--accent);font-weight:600;padding:8px 6px}
.back-btn{color:var(--accent);font-size:17px;padding:8px 4px;display:flex;align-items:center;gap:2px}
.back-btn svg{width:22px;height:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-weight:650;font-size:17px;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.985)}
.fab{position:fixed;right:20px;bottom:calc(var(--sab) + 20px);width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(79,70,229,.35);z-index:5}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.section-title{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .emoji{font-size:44px;margin-bottom:8px}

/* ---------- progress ---------- */
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.pbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lv-pill{font-size:12px;font-weight:650;padding:3px 8px;border-radius:99px;white-space:nowrap;color:#fff}
.lv-pill.lv0{background:var(--lv0)}.lv-pill.lv1{background:var(--lv1)}.lv-pill.lv2{background:var(--lv2)}
.lv-pill.lv3{background:var(--lv3);color:#1d2a05}.lv-pill.lv4{background:var(--lv4)}.lv-pill.lv5{background:var(--lv5)}

/* ---------- set list ---------- */
.set-list{display:flex;flex-direction:column;gap:12px}
.set-item{display:block;text-align:left;width:100%}
.set-item:active{transform:scale(.99)}
.set-item .row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.set-item .name{font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-item .pct{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.set-item .meta{font-size:14px;color:var(--muted);margin-bottom:10px}
.due-badge{color:var(--orange);font-weight:650}

.group-item .name::before{content:"📁";margin-right:8px}
.group-item{border-left:5px solid var(--accent)}
.backup-banner{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:12px 14px}
.backup-banner .txt{flex:1;font-size:14px}
.backup-banner button{background:var(--accent);color:var(--on-accent);border-radius:10px;padding:8px 12px;font-weight:650;font-size:14px;white-space:nowrap}
.check-list{max-height:55dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;margin:0 -4px 14px;border-top:1px solid var(--line)}
.ck-row{display:flex;width:100%;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px;text-align:left;min-width:0}
.ck-row .nm{flex:1;min-width:0;line-height:1.3;overflow-wrap:anywhere}
.ck-row .cnt{flex:none;font-size:13px;color:var(--muted);white-space:nowrap}
.ck-row .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--gray);box-sizing:border-box;display:grid;place-items:center}
.ck-row.on .ck{background:var(--accent);border-color:var(--accent)}
.ck-row.on .ck::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
/* ---------- set view ---------- */
.set-head .pct-big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.set-head .sub{color:var(--muted);margin:4px 0 14px;font-size:14px}
.learn-box{margin-top:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stepper .ctrl{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:12px;padding:4px}
.stepper .ctrl button{width:38px;height:34px;border-radius:9px;font-size:20px;color:var(--accent);font-weight:600}
.stepper .ctrl button:active{background:var(--accent-soft)}
.stepper .ctrl .val{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.search{width:100%;height:40px;border-radius:12px;border:0;background:var(--surface);padding:0 14px;margin-bottom:10px;font-size:16px;box-shadow:var(--shadow)}
.search:focus{outline:2px solid var(--accent)}
.card-list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.card-row:last-child{border-bottom:0}
.card-row:active{background:var(--surface2)}
.card-row .txt{flex:1;min-width:0}
.card-row .f{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row .b{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* ---------- session boxes ---------- */
.box{display:inline-block;flex:1 1 0;min-width:10px;max-width:22px;height:13px;border-radius:4px;background:var(--gray);position:relative;transition:background .25s}
.box.st-correct{background:var(--green)}
.box.st-double{background:var(--green-dark);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--green-dark)}
.box.st-ok{background:var(--orange)}
.box.st-wrong{background:var(--red)}
.box.cur::after{content:"";position:absolute;left:15%;right:15%;bottom:-8px;height:3px;border-radius:2px;background:var(--accent)}
.box.mini{flex:none;width:16px;height:11px;min-width:0}
.box.mini.st-double{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--green-dark)}

/* ---------- study ---------- */
.study{min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 4px) 16px calc(var(--sab) + 12px);max-width:640px;margin:0 auto}
.st-top{display:flex;align-items:center;gap:8px;min-height:44px}
.st-top .title{flex:1;text-align:center;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-top .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.boxbar{display:flex;gap:6px;overflow-x:auto;padding:8px 6px 14px;scrollbar-width:none;margin:0 -6px}
.boxbar::-webkit-scrollbar{display:none}
.card-stage{flex:1 1 auto;min-height:260px;position:relative;perspective:1400px;margin:4px 0 14px}
.card-drag{position:absolute;inset:0;touch-action:pan-y;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card-drag.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.face .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.face .content{font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.face.q .content{margin:auto 0;text-align:center;font-size:21px;font-weight:550}
.face.q .content ul,.face.q .content ol{text-align:left}
.face .divider{height:1px;background:var(--line);margin:18px 0 14px;flex:none}
.face .your{font-size:17px;color:var(--text);opacity:.9;overflow-wrap:anywhere}
.face .tap-hint{margin-top:auto;padding-top:12px;text-align:center;font-size:12px;color:var(--muted)}
.content img,.rte img{max-width:100%;height:auto;border-radius:10px;display:block;margin:8px auto}
.content ul,.content ol,.rte ul,.rte ol{margin:6px 0;padding-left:24px}
.hl{background:var(--hl);border-radius:4px;padding:0 2px;color:inherit;box-shadow:inset 0 -2px 0 var(--green)}
.swipe-tag{position:absolute;top:18px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:18px;opacity:0;pointer-events:none;z-index:3;border:3px solid}
.swipe-tag.left{right:18px;color:var(--red);border-color:var(--red);transform:rotate(10deg)}
.swipe-tag.right{left:18px;color:var(--green);border-color:var(--green);transform:rotate(-10deg)}
.answer-area{display:flex;flex-direction:column;gap:10px}
.answer-area textarea{width:100%;min-height:92px;max-height:30dvh;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:14px;font-size:17px;resize:none}
.answer-area textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.swipe-help{text-align:center;font-size:12px;color:var(--muted)}
.rate-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate-bar button{height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px}
.rate-bar .em{font-size:30px;line-height:1}
.rate-bar .wrong{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.rate-bar .ok{background:color-mix(in srgb,var(--orange) 16%,var(--surface));color:var(--orange)}
.rate-bar .right{background:color-mix(in srgb,var(--green) 16%,var(--surface));color:var(--green-dark)}
.rate-bar button:active{transform:scale(.96)}
@media (prefers-color-scheme: dark){.rate-bar .right{color:var(--green)}}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.done .emoji{font-size:64px}
.done h2{margin:0;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--surface);border-radius:14px;padding:12px 6px;box-shadow:var(--shadow)}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--muted)}

/* Nach Abgabe: Karte wächst mit dem Inhalt, die ganze Seite scrollt, Bewertungsleiste bleibt unten */
.study.answered{padding-bottom:0}
.study.answered .card-stage{flex:1 0 auto;display:flex;min-height:0;margin-bottom:10px}
.study.answered .card-drag{position:relative;inset:auto;flex:1;display:flex}
.study.answered .card3d{position:relative;inset:auto;flex:1;display:flex}
.study.answered .face.front{position:relative;inset:auto;flex:1;overflow:visible;min-height:240px}
.study.answered .face.back{overflow:auto}
.study.answered .rate-bar{position:sticky;bottom:0;z-index:4;background:var(--bg);padding:8px 0 calc(var(--sab) + 10px);box-shadow:0 -12px 12px -4px var(--bg)}
/* Tastatur offen: Lernansicht in den sichtbaren Bereich einpassen */
body.kb .study{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);min-height:0;padding-top:calc(var(--sat) + 2px);padding-bottom:8px;overflow:hidden}
body.kb .st-top{min-height:36px}
body.kb .boxbar{padding:4px 6px 8px}
body.kb .card-stage{min-height:80px;margin:0 0 8px}
body.kb .face{padding:14px 16px}
body.kb .face .tag{margin-bottom:4px}
body.kb .face.q .content{font-size:19px}
body.kb .swipe-help,body.kb .face .tap-hint{display:none}
body.kb .answer-area{gap:8px}
body.kb .answer-area textarea{min-height:60px;max-height:20vh;padding:10px 12px}
body.kb .answer-area .btn{height:44px}
/* ---------- MC-Tests ---------- */
.chip{background:var(--surface2);color:var(--accent);font-weight:650;font-size:14px;padding:7px 12px;border-radius:10px}
.chip.wide{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:active{background:var(--accent-soft)}
.box.st-seen{background:var(--accent);opacity:.55}
.mc-group-item .name::before{content:"☑︎"!important;color:var(--accent)}
.mc-group-item{border-left-color:var(--green)}
.quiz-item .name::before{content:"☑︎";margin-right:8px;color:var(--accent)}
.mcpage{min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 4px) 16px 0;max-width:640px;margin:0 auto}
.mcpage .content{flex:1;padding-bottom:12px}
.mc-q{font-size:19px;font-weight:650;line-height:1.4;overflow-wrap:anywhere}
.mc-hint{font-size:13px;color:var(--muted);margin-top:6px}
.mc-opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mc-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);border:2px solid transparent;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.mc-opt .chk{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--gray);display:grid;place-items:center;font-size:14px;font-weight:900;margin-top:1px;color:transparent}
.mc-opt .body{flex:1;min-width:0}
.mc-opt.sel{border-color:var(--accent)}
.mc-opt.sel .chk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mc-opt.ok-sel{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--surface))}
.mc-opt.ok-sel .chk{background:var(--green);border-color:var(--green);color:#fff}
.mc-opt.ok-miss{border:2px dashed var(--green)}
.mc-opt.ok-miss .chk{border-color:var(--green)}
.mc-opt.bad-sel{border-color:var(--red);background:color-mix(in srgb,var(--red) 11%,var(--surface))}
.mc-opt.bad-sel .chk{background:var(--red);border-color:var(--red);color:#fff}
.mc-opt.neutral{opacity:.72}
.mc-opt .verdict{display:block;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.mc-opt.ok-sel .verdict,.mc-opt.ok-miss .verdict{color:var(--green-dark)}
.preview .mc-opt.neutral{opacity:.85}
.mc-opt.bad-sel .verdict{color:var(--red)}
.mc-opt.neutral .verdict{color:var(--muted)}
@media (prefers-color-scheme: dark){.mc-opt.ok-sel .verdict,.mc-opt.ok-miss .verdict{color:var(--green)}}
.mc-opt .why{margin-top:6px;font-size:14px;color:var(--muted);line-height:1.4}
.mc-banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin-top:14px;font-weight:650}
.mc-banner.good{background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.mc-banner.bad{background:color-mix(in srgb,var(--red) 13%,var(--surface))}
.mc-banner .em{font-size:28px}
.mc-banner small{display:block;font-weight:500;color:var(--muted)}
.mc-bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(var(--sab) + 12px);box-shadow:0 -12px 12px -4px var(--bg);z-index:3}
.switch-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--gray);transition:.2s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.q-row .dot{flex:none;width:12px;height:12px;border-radius:4px}
.q-row .f{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.preview{background:var(--bg);width:100%;max-width:640px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(var(--sab) + 16px);animation:up .22s}
.preview .mc-opt{box-shadow:none}
.result-list{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:8px}
/* ---------- modal / sheets ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:10px 12px calc(var(--sab) + 12px);animation:up .22s}
.sheet h3{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin:8px 0 10px}
.sheet .group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:10px}
.sheet .group button{display:block;width:100%;padding:16px;text-align:center;font-size:17px;color:var(--accent);border-bottom:1px solid var(--line)}
.sheet .group button:last-child{border-bottom:0}
.sheet .group button.danger{color:var(--red)}
.sheet .group button:active{background:var(--surface2)}
.sheet .cancel{font-weight:650}
.dialog{background:var(--surface);border-radius:20px;width:100%;max-width:380px;padding:20px;animation:up .2s}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog p{margin:0 0 14px;color:var(--muted);font-size:15px;white-space:pre-line}
.dialog input[type=text],.dialog textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font-size:16px;margin-bottom:12px}
.dialog textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.dialog .btns{display:flex;gap:10px}
.dialog .btns button{flex:1;height:46px;border-radius:12px;font-weight:650;background:var(--surface2);color:var(--accent)}
.dialog .btns button.primary{background:var(--accent);color:var(--on-accent)}
.dialog .btns button.danger{background:var(--red);color:#fff}

/* ---------- editor ---------- */

<body>
<div id="app"></div>
<input type="file" id="file-import" accept=".json,.txt,.md,.csv,.tsv,.xml,application/json,text/plain,text/xml,application/xml" class="hidden">
<input type="file" id="file-image" accept="image/*" class="hidden">
<script>
"use strict";
/* =========================================================
   Kartei – Karteikarten-Lern-App (PWA)
   ========================================================= */
const APP_VERSION = 14;
const DAY = 86400000;
const LEVELS = ['Neu','Schlecht','OK','Gut','Sehr gut','Perfekt'];
const PROGRESS_KEYS = ['level','due','reviews','nCorrect','nWrong','lastSession','lastReviewed','perfectStreak'];
const SESSION_KEY = 'kartei-open-session';

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const app = $('#app');

/* ---------------- storage (IndexedDB) ---------------- */
const Store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('kartei', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('sets', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode) { return this.db.transaction('sets', mode).objectStore('sets'); },
  all() { return new Promise((res, rej) => { const q = this.tx('readonly').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  put(set) { return new Promise((res, rej) => { const q = this.tx('readwrite').put(set); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  del(id) { return new Promise((res, rej) => { const q = this.tx('readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
};
let sets = [], groups = [], quizzes = [];
const getSet = id => sets.find(s => s.id === id);
const getGroup = id => groups.find(g => g.id === id);
const getQuiz = id => quizzes.find(q => q.id === id);
const groupQuizzes = g => quizzes.filter(q => q.groupId === g.id).sort(byName);
const groupSets = g => sets.filter(s => s.groupId === g.id).sort(byName);
const cardGroups = () => groups.filter(g => g.kind !== 'mc');
const byName = (a, b) => a.name.localeCompare(b.name, 'de', { numeric: true });
function newGroup(name, kind = 'cards') { return { id: uid(), type: 'group', kind, name: name || 'Neue Gruppe', created: Date.now(), updated: Date.now() }; }
async function findOrCreateGroup(name, kind = 'cards') {
  let g = groups.find(x => x.name === name && (x.kind || 'cards') === kind);
  if (!g) { g = newGroup(name, kind); groups.push(g); await saveSet(g); }
  return g;
}
async function saveSet(set) {
  set.updated = Date.now();
  try { await Store.put(set); } catch (e) { toast('Speichern fehlgeschlagen: ' + e.message); }
}

function newCard(front, back) {
  return { id: uid(), front, back, level: 0, due: null, reviews: 0, nCorrect: 0, nWrong: 0,
           lastSession: null, lastReviewed: null, perfectStreak: 0, created: Date.now() };
}
const GAP_MIN = 1, GAP_MAX = 5, GAP_DEFAULT = 3;
// ungültig → Standard; früher gespeicherte größere Werte werden auf das Maximum begrenzt
const wrongGap = set => { const g = Math.round(+(set && set.wrongGap)); return g >= GAP_MIN ? Math.min(g, GAP_MAX) : GAP_DEFAULT; };
function newSet(name, groupId = null) {
  return { id: uid(), name: name || 'Neues Set', groupId, sessionSize: 10, cards: [], created: Date.now(), updated: Date.now(), lastStudied: null };
}
// Status manuell setzen: Wiederholungstermin passend zur neuen Stufe neu berechnen
function setLevel(c, lv) {
  lv = Math.max(0, Math.min(5, lv | 0));
  if (lv === 0) { resetProgress(c); return; }
  c.level = lv;
  c.perfectStreak = lv === 5 ? 1 : 0;
  c.due = startOfDay(Date.now()) + intervalDays(c) * DAY;
}
function resetProgress(c) {
  Object.assign(c, { level: 0, due: null, reviews: 0, nCorrect: 0, nWrong: 0, lastSession: null, lastReviewed: null, perfectStreak: 0 });
}

/* ---------------- learning system ----------------
   Stufen: 0 Neu · 1 Schlecht · 2 OK · 3 Gut · 4 Sehr gut · 5 Perfekt
   Wiederholungsintervall (Tage): Schlecht 0 · OK 1 · Gut 3 · Sehr gut 7 ·
   Perfekt 14 → 28 → 56 → … (max 180), je öfter fehlerfrei.            */
function intervalDays(c) {
  switch (c.level) {
    case 1: return 0;
    case 2: return 1;
    case 3: return 3;
    case 4: return 7;
    case 5: return Math.min(180, 14 * Math.pow(2, Math.max(0, (c.perfectStreak || 1) - 1)));
    default: return 0;
  }
}
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isDue = (c, now = Date.now()) => c.level > 0 && (c.due == null || c.due <= now);

// Kartenauswahl: fällige & schwache Karten bevorzugt, gute seltener (nie ausgeschlossen)
const LEVEL_WEIGHT = [4, 6, 4, 2, 1.2, 0.6];
function pickCards(cards, n) {
  const now = Date.now();
  // 1. Zuerst alle noch nie gelernten Karten (zufällig), erst danach wird wiederholt
  const fresh = shuffle(cards.filter(c => c.level === 0));
  if (fresh.length >= n) return fresh.slice(0, n);
  // 2. Rest auffüllen: fällige & schwache bevorzugt, gute seltener
  const keyed = cards.filter(c => c.level !== 0).map(c => {
    let w = LEVEL_WEIGHT[c.level] ?? 1;
    if (isDue(c, now)) w *= 3;
    return { c, k: Math.pow(Math.random(), 1 / w) };
  });
  keyed.sort((a, b) => b.k - a.k);
  return shuffle(fresh.concat(keyed.slice(0, n - fresh.length).map(x => x.c)));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function setStats(set) {
  const counts = [0, 0, 0, 0, 0, 0];
  let due = 0; const now = Date.now();
  for (const c of set.cards) { counts[c.level] = (counts[c.level] || 0) + 1; if (isDue(c, now)) due++; }
  const n = set.cards.length;
  const pct = n ? Math.round(set.cards.reduce((s, c) => s + c.level, 0) / (n * 5) * 100) : 0;
  return { counts, due, n, pct, newCount: counts[0] };
}
function groupStats(g) {
  const list = groupSets(g);
  const st = setStats({ cards: list.flatMap(s => s.cards) });
  st.sets = list.length;
  st.last = Math.max(g.updated || 0, ...list.map(s => s.lastStudied || s.updated || 0));
  return st;
}
function pbarHtml(counts, n) {
  if (!n) return '<div class="pbar"></div>';
  // reihenfolge: perfekt → neu, damit der "gute" teil links wächst
  return '<div class="pbar">' + [5, 4, 3, 2, 1, 0].map(l => counts[l] ? `<span style="width:${counts[l] / n * 100}%;background:var(--lv${l})"></span>` : '').join('') + '</div>';
}

/* ---------------- html helpers ---------------- */
const ALLOWED = new Set(['B','STRONG','I','EM','U','BR','P','DIV','UL','OL','LI','IMG','SUB','SUP','SPAN']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','META','LINK','TITLE','HEAD','svg','SVG','TEMPLATE','NOSCRIPT']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  (function clean(node) {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 3) continue;
      if (ch.nodeType !== 1) { ch.remove(); continue; }
      const tag = ch.tagName;
      if (DROP.has(tag)) { ch.remove(); continue; }
      if (!ALLOWED.has(tag)) { clean(ch); ch.replaceWith(...ch.childNodes); continue; }
      const src = tag === 'IMG' ? ch.getAttribute('src') : null;
      const st = (ch.getAttribute('style') || '').toLowerCase();
      for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
      if (tag === 'IMG') { if (src && /^data:image\/(png|jpe?g|gif|webp);base64,/i.test(src)) ch.setAttribute('src', src); else ch.remove(); continue; }
      if (tag === 'SPAN') {
        // Formatierung aus eingefügten Texten (style) in Tags umwandeln
        clean(ch);
        let inner = [...ch.childNodes];
        let wrap = null;
        const mk = t => { const e = doc.createElement(t); if (wrap) e.append(wrap); else e.append(...inner); wrap = e; };
        if (/font-weight:\s*(bold|[6-9]00)/.test(st)) mk('B');
        if (/font-style:\s*italic/.test(st)) mk('I');
        if (/text-decoration[^;]*underline/.test(st)) mk('U');
        if (wrap) ch.replaceWith(wrap); else ch.replaceWith(...inner);
        continue;
      }
      clean(ch);
    }
  })(doc.body);
  return doc.body.innerHTML.replace(/^(\s|<br>)+|(\s|<br>)+$/g, '');
}
function plainText(html) {
  const d = document.createElement('div');
  d.innerHTML = (html || '').replace(/<img[^>]*>/gi, ' 🖼 ').replace(/<(br|\/p|\/div|\/li)>/gi, ' $&');
  return d.textContent.replace(/\s+/g, ' ').trim();
}
function isEmptyHtml(html) { return !plainText(html) && !/<img/i.test(html || ''); }
function textToHtml(t) { return esc(t).replace(/\n/g, '<br>'); }

// Wörter der Musterlösung, die auch in der Antwort vorkommen, grün markieren
const WORD_RE = /[\p{L}\p{N}]+(?:[-'’][\p{L}\p{N}]+)*/gu;
const normWord = w => w.toLocaleLowerCase('de').normalize('NFC');
// Füllwörter werden nicht markiert, damit nur die inhaltlichen Treffer auffallen
const STOPWORDS = new Set(('der die das den dem des ein eine einer eines einem einen und oder aber ist sind war wird werden wurde ' +
  'bei von vom zu zum zur in im ins an am auf aus mit für nicht nur so dass daß sodass als auch es er sie sich wenn wie nach über unter ' +
  'durch um vor bis ob kein keine sein seine ihr ihre hat haben kann können muss müssen soll sollen dabei daher diese dieser dieses ' +
  'also noch schon sowie bzw zb idr etwa jedoch denn weil da hier dort man wer was welche welcher welches').split(' '));
function highlightHtml(html, answer) {
  const words = new Set((answer.match(WORD_RE) || []).map(normWord).filter(w => !STOPWORDS.has(w)));
  if (!words.size) return html;
  const div = document.createElement('div');
  div.innerHTML = html;
  const walker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const t of nodes) {
    const s = t.nodeValue; let last = 0, any = false; const frag = document.createDocumentFragment();
    for (const m of s.matchAll(WORD_RE)) {
      if (!words.has(normWord(m[0]))) continue;
      any = true;
      frag.append(s.slice(last, m.index));
      const sp = document.createElement('span'); sp.className = 'hl'; sp.textContent = m[0]; frag.append(sp);
      last = m.index + m[0].length;
    }
    if (any) { frag.append(s.slice(last)); t.replaceWith(frag); }
  }
  return div.innerHTML;
}

/* ---------------- UI helpers ---------------- */
function toast(msg, ms = 2400) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), ms);
}
function sheet(title, items) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="sheet">${title ? `<h3>${esc(title)}</h3>` : ''}
      <div class="group">${items.map((it, i) => `<button data-i="${i}" class="${it.danger ? 'danger' : ''}">${esc(it.label)}</button>`).join('')}</div>
      <div class="group"><button class="cancel" data-i="-1">Abbrechen</button></div></div>`;
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b) { const i = +b.dataset.i; close(i); if (i >= 0 && items[i].action) items[i].action(); }
      else if (e.target === ov) close(-1);
    });
    document.body.append(ov);
  });
}
function dialog({ title, message = '', input = null, textarea = null, buttons = [{ label: 'OK', value: true, kind: 'primary' }] }) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'overlay center';
    ov.innerHTML = `<div class="dialog"><h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}
      ${input !== null ? `<input type="text" value="${esc(input.value || '')}" placeholder="${esc(input.placeholder || '')}">` : ''}
      ${textarea !== null ? `<textarea placeholder="${esc(textarea.placeholder || '')}">${esc(textarea.value || '')}</textarea>` : ''}
      <div class="btns">${buttons.map((b, i) => `<button data-i="${i}" class="${b.kind || ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
    const field = $('input,textarea', ov);
    ov.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      const btn = buttons[+b.dataset.i];
      ov.remove();
      resolve({ value: btn.value, text: field ? field.value : null });
    });
    document.body.append(ov);
    if (field) setTimeout(() => { field.focus(); if (field.select && input) field.select(); }, 50);
  });
}
const confirmBox = async (title, message, okLabel = 'OK', danger = false) =>
  (await dialog({ title, message, buttons: [{ label: 'Abbrechen', value: false }, { label: okLabel, value: true, kind: danger ? 'danger' : 'primary' }] })).value;

const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_MORE = '<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

/* ---------------- routing ---------------- */
let view = { name: 'home' };
function go(v) { view = v; render(); window.scrollTo(0, 0); updViewport(); }
function render() {
  if (view.name === 'home') renderHome();
  else if (view.name === 'set') renderSet();
  else if (view.name === 'group') renderGroup();
  else if (view.name === 'quiz') renderQuiz();
  else if (view.name === 'mc') renderMC();
  else if (view.name === 'study') renderStudy();
}

/* ---------------- HOME ---------------- */
const BACKUP_KEY = 'kartei-last-backup';
const lastBackup = () => { try { return +localStorage.getItem(BACKUP_KEY) || 0; } catch { return 0; } };
function setItemHtml(s) {
  const st = setStats(s);
  return `<button class="panel set-item" data-a="open" data-id="${s.id}">
    <div class="row"><div class="name">${esc(s.name)}</div><div class="pct">${st.pct}%</div></div>
    <div class="meta">${st.n} Karte${st.n === 1 ? '' : 'n'}${st.due ? ` · <span class="due-badge">${st.due} fällig</span>` : ''}${st.newCount ? ` · ${st.newCount} neu` : ''}</div>
    ${pbarHtml(st.counts, st.n)}</button>`;
}
function groupItemHtml(g) {
  const st = groupStats(g);
  return `<button class="panel set-item group-item" data-a="group" data-id="${g.id}">
    <div class="row"><div class="name">${esc(g.name)}</div><div class="pct">${st.pct}%</div></div>
    <div class="meta">${st.sets} Set${st.sets === 1 ? '' : 's'} · ${st.n} Karten${st.due ? ` · <span class="due-badge">${st.due} fällig</span>` : ''}</div>
    ${pbarHtml(st.counts, st.n)}</button>`;
}
function backupBannerHtml() {
  const lastStudy = Math.max(0, ...sets.map(s => s.lastStudied || 0), ...quizzes.map(q => q.lastStudied || 0));
  const lb = lastBackup();
  if (!lastStudy || lastStudy <= lb || Date.now() - lb < 7 * DAY) return '';
  const days = lb ? Math.floor((Date.now() - lb) / DAY) : null;
  return `<div class="panel backup-banner"><div class="txt">💾 <b>${lb ? `Letzte Sicherung vor ${days} Tagen` : 'Noch keine Sicherung'}</b><br><span class="muted">Sichere deinen Fortschritt z. B. in iCloud Drive.</span></div>
    <button data-a="backup">Sichern</button></div>`;
}
function renderHome() {
  const recent = (a, b) => (b.lastStudied || b.updated) - (a.lastStudied || a.updated);
  const loose = sets.filter(s => !s.groupId || !getGroup(s.groupId)).sort(recent);
  const gLast = g => isMcGroup(g) ? mcGroupStats(g).last : groupStats(g).last;
  const gs = [...groups].sort((a, b) => gLast(b) - gLast(a));
  app.innerHTML = `<div class="page">
    <div class="topbar"><div class="grow"></div>
      <button class="text-btn" data-a="import">Importieren</button>
      <button class="icon-btn" data-a="more" aria-label="Mehr">${ICON_MORE}</button></div>
    <div class="big-title">Meine Sets</div>
    ${backupBannerHtml()}
    ${gs.length && loose.length ? '<div class="section-title" style="margin-top:4px">Gruppen</div>' : ''}
    ${gs.length ? `<div class="set-list">${gs.map(g => isMcGroup(g) ? mcGroupItemHtml(g) : groupItemHtml(g)).join('')}</div>` : ''}
    ${gs.length && loose.length ? '<div class="section-title">Sets</div>' : ''}
    ${loose.length ? `<div class="set-list">${loose.map(setItemHtml).join('')}</div>` : ''}
    ${!gs.length && !loose.length ? `<div class="empty"><div class="emoji">🗂️</div><b>Noch keine Lernsets</b><br>Tippe auf ＋ um ein Set oder eine Gruppe anzulegen,<br>oder importiere eine Datei.</div>` : ''}
  </div>
  <button class="fab" data-a="new" aria-label="Neu">＋</button>`;
  app.onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'open') go({ name: 'set', id: b.dataset.id });
    else if (a === 'quiz') go({ name: 'quiz', id: b.dataset.id });
    else if (a === 'group') go({ name: 'group', id: b.dataset.id });
    else if (a === 'new') sheet('Neu anlegen', [
      { label: 'Neues Lernset', action: () => createSet(null) },
      { label: 'Neue Karteikarten-Gruppe', action: createGroup },
      { label: 'Neue MC-Test-Gruppe', action: createMcGroup },
    ]);
    else if (a === 'import') importFlow(null, null);
    else if (a === 'backup') backupNow();
    else if (a === 'more') sheet(`Kartei · Version ${APP_VERSION}`, [
      { label: 'Backup erstellen (alles, mit Fortschritt)', action: backupNow },
      { label: 'Backup wiederherstellen', action: () => pickFile(txt => restoreBackup(txt)) },
      { label: 'Mehrere Sets löschen', danger: true, action: deleteManySets },
      { label: 'Info zum Lernsystem', action: showHelp },
      { label: 'Info zur Datensicherung', action: showStorageHelp },
    ]);
  };
}
async function createSet(group) {
  const r = await dialog({ title: group ? `Neues Lernset in „${group.name}“` : 'Neues Lernset', input: { placeholder: 'Name, z. B. Kapitel 1' }, buttons: [{ label: 'Abbrechen', value: false }, { label: 'Anlegen', value: true, kind: 'primary' }] });
  if (!r.value) return;
  const s = newSet(r.text.trim() || 'Neues Set', group ? group.id : null); sets.push(s); await saveSet(s); go({ name: 'set', id: s.id });
}
async function createGroup() {
  const r = await dialog({ title: 'Neue Gruppe', message: 'Eine Gruppe fasst mehrere Lernsets zu einem Oberthema zusammen.', input: { placeholder: 'z. B. Privatrecht I' }, buttons: [{ label: 'Abbrechen', value: false }, { label: 'Anlegen', value: true, kind: 'primary' }] });
  if (!r.value) return;
  const g = newGroup(r.text.trim() || 'Neue Gruppe'); groups.push(g); await saveSet(g); go({ name: 'group', id: g.id });
}
// Auswahlliste mit eigenen Häkchen (keine nativen Checkboxen → sieht auf jedem iPhone gleich aus)
function pickSetsDialog(title, list, okLabel, danger = false, preselected = []) {
  return new Promise(resolve => {
    const sel = new Set(preselected.filter(id => list.some(x => x.id === id)));

function setupSwipe() {

    tr.style.opacity = Math.max(0, Math.min(1, dx / 90));

  const reset = () => {
    drag.classList.add('anim'); drag.style.transform = ''; tl.style.opacity = tr.style.opacity = 0;
  };

      const commit = Math.abs(dx) > 100 || (Math.abs(vx) > 0.35 && Math.abs(dx) > 40 && Math.sign(vx) === Math.sign(dx));

let rating = false;
function rate(kind) {

  rating = true;

  m.touched = true; S.ratings++;
  if (kind === 'wrong') {
    m.hadWrong = true; it.st = 'wrong';
    // um den eingestellten Abstand nach hinten – höchstens bis ans Ende der noch offenen Karten
    const k = Math.max(0, Math.min(wrongGap(getSet(S.setId)), S.queue.length - 1 - S.pos));

  }

    setTimeout(next, 240);

}

// Ergebnisse eines (abgeschlossenen oder abgebrochenen) Durchgangs in die Karten übernehmen
function applySession(sess) {

async function doImport(txt, baseName, target, asJson, group) {
  let parsed;

  catch (e) { return dialog({ title: 'Import fehlgeschlagen', message: 'Die Datei konnte nicht gelesen werden.\n' + e.message }); }
  const total = parsed.sets.reduce((n, s) => n + s.cards.length, 0);
  if (!target && parsed.quizzes && parsed.quizzes.length) {
    const qr = await importQuizzes(parsed.quizzes, group);
    if (!total) { toast(qr.msg, 3500); return go(qr.group ? { name: 'group', id: qr.group.id } : { name: 'home' }); }
  }
  if (!total) return dialog({ title: 'Keine Karten gefunden', message: 'Bitte prüfe das Format (Importieren → Formatbeschreibung).' });
  const skippedMsg = parsed.skipped ? ` (${parsed.skipped} übersprungen)` : '';
  if (target) {
    parsed.sets.forEach(s => s.cards.forEach(c => target.cards.push(buildCard(c))));
    await saveSet(target); renderSet();
    toast(`${total} Karten importiert${skippedMsg}`);
  } else {
    let last;
    for (const s of parsed.sets) {
      // in eine Gruppe importieren → alles dort hinein; sonst Gruppe aus der Datei übernehmen
      const g = (group && !isMcGroup(group) ? group : null) || (s.group ? await findOrCreateGroup(s.group, 'cards') : null);
      const ns = newSet(s.name, g ? g.id : null); ns.sessionSize = s.sessionSize || 10; if (s.wrongGap) ns.wrongGap = wrongGap(s);
      ns.cards = s.cards.map(buildCard); sets.push(ns); await saveSet(ns); last = ns;
    }
    toast(`${parsed.sets.length > 1 ? parsed.sets.length + ' Sets, ' : ''}${total} Karten importiert${skippedMsg}`);
    if (parsed.sets.length === 1) go({ name: 'set', id: last.id });
    else if (group && !isMcGroup(group)) go({ name: 'group', id: group.id });
    else render();
  }
}
/* ---------------- MM-Import: Glossar-XML ----------------
   <glossary><item id=".." chapter="14"><term>…</term><description>…</description></item>…</glossary>
   Pro Kapitel ein eigenes Set. Kapitel 0 enthält nur Verweise (Synonyme) und wird übersprungen.
   Erneuter Import aktualisiert bestehende Sets (gleicher Name) und behält den Fortschritt. */
function mmDescToHtml(desc, termMap) {
  let d = (desc || '').replace(/\r/g, '').trim();
  // reiner Verweis („-> Begriff“) → Definition des Zielbegriffs übernehmen
  const ref = d.match(/^->\s*(.+)$/s);
  if (ref && termMap.has(ref[1].trim().toLowerCase())) d = termMap.get(ref[1].trim().toLowerCase()).replace(/\r/g, '').trim();
  let src = '';
  const m = d.match(/\s+–\s+([IVX]+\/[^–]*)$/);
  if (m) { src = m[1].trim(); d = d.slice(0, m.index).trim(); }
  let html = esc(d).replace(/[-–—]+&gt;\s*/g, '→ ').replace(/\n/g, '<br>');
  if (src) html += `<br><br><i>Fundstelle: ${esc(src)}</i>`;
  return html;
}
async function mmImport(xml, targetGroup) {
  let doc;
  try {
    doc = new DOMParser().parseFromString(xml.replace(/^﻿/, ''), 'application/xml');
    if (doc.querySelector('parsererror') || !doc.querySelector('glossary')) throw new Error('Keine Glossar-Datei');
  } catch (e) { return dialog({ title: 'MM-Import fehlgeschlagen', message: e.message }); }
  const items = [...doc.querySelectorAll('glossary > item')].map(it => ({
    chapter: parseInt(it.getAttribute('chapter'), 10) || 0,
    term: (it.querySelector('term')?.textContent || '').trim(),
    desc: (it.querySelector('description')?.textContent || '').trim(),
  })).filter(x => x.term && x.desc);
  const termMap = new Map();
  for (const x of items) if (!/^->/.test(x.desc) && !termMap.has(x.term.toLowerCase())) termMap.set(x.term.toLowerCase(), x.desc);
  const byChapter = new Map();
  for (const x of items) {
    if (x.chapter <= 0) continue;
    if (!byChapter.has(x.chapter)) byChapter.set(x.chapter, []);
    const list = byChapter.get(x.chapter);
    if (!list.some(y => y.term === x.term)) list.push(x);
  }
  if (!byChapter.size) return dialog({ title: 'Keine Karten gefunden', message: 'Die Datei enthält keine Begriffe mit Kapitelnummer.' });
  const chapters = [...byChapter.keys()].sort((a, b) => a - b);
  const total = chapters.reduce((n, c) => n + byChapter.get(c).length, 0);
  let group = targetGroup;
  if (!group) {
    const r = await dialog({ title: 'MM-Import', message: `${total} Begriffe in ${chapters.length} Kapiteln gefunden (Kap. ${chapters[0]}–${chapters.at(-1)}).\nEs wird eine Gruppe mit einem Lernset pro Kapitel angelegt. Name der Gruppe:`,
      input: { value: 'Privatrecht I' }, buttons: [{ label: 'Abbrechen', value: false }, { label: 'Importieren', value: true, kind: 'primary' }] });
    if (!r.value) return;
    group = await findOrCreateGroup((r.text || '').trim() || 'MM', 'cards');
  } else {
    const ok = await confirmBox('MM-Import', `${total} Begriffe in ${chapters.length} Kapiteln gefunden (Kap. ${chapters[0]}–${chapters.at(-1)}).\nIn „${group.name}“ wird pro Kapitel ein Lernset angelegt.`, 'Importieren');
    if (!ok) return;
  }
  const chName = ch => `Kapitel ${String(ch).padStart(2, '0')}`;
  // früher ohne Gruppe importierte Kapitel-Sets („MM – Kapitel 01“) übernehmen, Fortschritt bleibt erhalten
  const old = sets.filter(s => !getGroup(s.groupId) && /^.+ – Kapitel \d+$/.test(s.name) && chapters.includes(parseInt(s.name.match(/(\d+)$/)[1], 10))
    && !groupSets(group).some(x => x.name === chName(parseInt(s.name.match(/(\d+)$/)[1], 10))));
  if (old.length && await confirmBox('Vorhandene Kapitel-Sets gefunden', `${old.length} bereits importierte Kapitel-Sets (z. B. „${old[0].name}“) liegen noch auf der Startseite.\nSollen sie samt Fortschritt in „${group.name}“ übernommen werden?`, 'Übernehmen')) {
    for (const s of old) { s.name = chName(parseInt(s.name.match(/(\d+)$/)[1], 10)); s.groupId = group.id; await saveSet(s); }
  }
  let created = 0, added = 0, updated = 0;
  for (const ch of chapters) {
    const name = chName(ch);
    let set = sets.find(s => s.groupId === group.id && s.name === name);
    if (!set) { set = newSet(name, group.id); sets.push(set); created++; }
    for (const x of byChapter.get(ch)) {
      const front = esc(x.term), back = mmDescToHtml(x.desc, termMap);
      const ex = set.cards.find(c => plainText(c.front) === plainText(front));
      if (ex) { if (ex.back !== back) { ex.back = back; updated++; } }
      else { set.cards.push(newCard(front, back)); added++; }
    }
    await saveSet(set);
  }
  toast(created || added || updated ? `${created} Sets angelegt · ${added} Karten neu${updated ? ` · ${updated} aktualisiert` : ''}` : 'Alles schon aktuell – nichts Neues gefunden', 3500);
  go({ name: 'group', id: group.id });
}

/* =========================================================

   quiz = { id, type:'quiz', name, groupId, chapter, sessionSize, lastStudied,
            questions:[ { id, text, answers:[{text, correct, meaning}], st:{n, ok, last:'r'|'w'|null, streak, at} } ] }
   Ablauf wie eine Prüfung: alle Fragen beantworten → abgeben → erst dann Lösung & Punkte.

const MC_SESSION_KEY = 'kartei-mc-session';
const isMcGroup = g => !!g && g.kind === 'mc';

const qStatus = q => !q.st || !q.st.n ? 'new' : q.st.last === 'w' ? 'wrong' : q.st.streak >= 2 ? 'sure' : 'right';

function quizStats(qz) {
  const c = { new: 0, wrong: 0, right: 0, sure: 0 };
  for (const q of qz.questions) c[qStatus(q)]++;
  const n = qz.questions.length;
  return { c, n, right: c.right + c.sure, pct: n ? Math.round((c.right + c.sure) / n * 100) : 0 };
}
function qbarHtml(st) {

let MQ = null;

async function submitMC() {
  const now = Date.now(); const touched = new Set();
  for (const it of MQ.items) {
    const { qz, q } = mcItemQ(it); const sel = new Set(it.sel);
    let right = 0; q.answers.forEach((x, i) => { if (!!x.correct === sel.has(i)) right++; });
    it.stmts = right; it.res = right === q.answers.length ? 'r' : 'w';
    const s = q.st || (q.st = newQStat());
    s.n++; s.at = now;
    if (it.res === 'r') { s.ok++; s.streak = s.last === 'r' ? s.streak + 1 : 1; s.last = 'r'; } else { s.last = 'w'; s.streak = 0; }
    qz.lastStudied = now; touched.add(qz);
  }
  for (const qz of touched) await saveSet(qz);
  MQ.submitted = true; MQ.finished = now;
  const g = getGroup(MQ.groupId);
  if (g) { (g.history || (g.history = [])).push({ at: now, n: MQ.items.length, right: MQ.items.filter(x => x.res === 'r').length, label: MQ.label || '' }); g.history = g.history.slice(-30); await saveSet(g); }

}

    <div style="height:18px"></div>

/* ---------- Import ---------- */
function pickMcFiles(group) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = '.xml,.json,text/xml,application/xml,application/json';
  inp.onchange = async () => {
    const files = [...inp.files]; if (!files.length) return;
    const loaded = await Promise.all(files.map(async f => ({ name: f.name, text: await f.text() })));
    const json = loaded.filter(f => /^\s*\{/.test(f.text)), xml = loaded.filter(f => !/^\s*\{/.test(f.text));
    for (const f of json) await doImport(f.text, f.name.replace(/\.(kartei\.)?json$/i, ''), null, true, group);
    if (xml.length) await mcImportFiles(xml, group);
  };
  inp.click();
}
function parseMcXml(text) {
  const doc = new DOMParser().parseFromString(text.replace(/^﻿/, ''), 'application/xml');
  if (doc.querySelector('parsererror') || !doc.querySelector('mctest')) return null;
  const clean = t => (t || '').replace(/\r\n?/g, '\n').trim();
  return [...doc.querySelectorAll('mctest > frage')].map(f => ({
    text: clean(f.querySelector(':scope > text')?.textContent),
    answers: [...f.querySelectorAll(':scope > answers > aw')].map(a => ({
      text: clean(a.querySelector('text')?.textContent),
      correct: (a.querySelector('correct')?.textContent || '').trim() === 'true',
      meaning: clean(a.querySelector('meaning')?.textContent),
    })).filter(a => a.text),
  })).filter(q => q.text && q.answers.length);
}
function mcNameFromFile(fname) {
  const base = fname.replace(/\.xml$/i, '');
  const m = base.match(/\d+/); const ch = m ? parseInt(m[0], 10) : null;
  const topic = base.replace(/\d+/, ' ').replace(/\b(mc|test)\b/ig, ' ').replace(/^(mc|MC)|(mc|MC)(?=[A-ZÄÖÜ])/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[-–\s]+|[-–\s]+$/g, '');
  return { chapter: ch, name: ch != null ? `Kapitel ${String(ch).padStart(2, '0')}${topic ? ' · ' + topic : ''}` : (topic || base) };
}
async function askMcGroup(message) {
  const mg = mcGroups().sort((a, b) => mcGroupStats(b).last - mcGroupStats(a).last);
  const r = await dialog({ title: 'MC-Tests importieren', message: message + '\nIn welche MC-Gruppe? (Neue wird angelegt, falls es sie nicht gibt.)',
    input: { value: mg.length ? mg[0].name : 'Privatrecht I – MC' }, buttons: [{ label: 'Abbrechen', value: false }, { label: 'Importieren', value: true, kind: 'primary' }] });
  if (!r.value) return null;
  return findOrCreateGroup((r.text || '').trim() || 'MC-Tests', 'mc');
}
async function mcImportFiles(files, group) {
  const list = []; const bad = [];
  for (const f of files) {
    const qs = parseMcXml(f.text);
    if (!qs || !qs.length) { bad.push(f.name); continue; }
    const nm = mcNameFromFile(f.name);
    list.push({ name: nm.name, chapter: nm.chapter, questions: qs });
  }
  if (!list.length) return dialog({ title: 'Keine MC-Tests gefunden', message: bad.length ? `Diese Dateien konnten nicht gelesen werden:\n${bad.join('\n')}` : 'Die Dateien enthalten keine Fragen.' });
  if (!isMcGroup(group)) {
    group = await askMcGroup(`${list.length} Test${list.length === 1 ? '' : 's'} mit ${list.reduce((n, x) => n + x.questions.length, 0)} Fragen gefunden.`);
    if (!group) return;
  }
  const res = await importQuizzes(list, group);
  toast(res.msg + (bad.length ? ` · ${bad.length} Datei(en) übersprungen` : ''), 3500);
  go({ name: 'group', id: group.id });
}
// Tests anlegen oder aktualisieren (gleiche MC-Gruppe + gleiches Kapitel bzw. Name) – Ergebnisse bleiben erhalten
async function importQuizzes(list, group) {
  let created = 0, addedQ = 0, updatedQ = 0, firstGroup = null;
  for (const raw of list) {
    const g = isMcGroup(group) ? group : await findOrCreateGroup(String(raw.group || (group && group.name) || 'MC-Tests'), 'mc');
    firstGroup = firstGroup || g;
    const ch = raw.chapter != null && raw.chapter !== '' ? +raw.chapter : null;
    let qz = quizzes.find(q => q.groupId === g.id && (ch != null ? q.chapter === ch : q.name === raw.name));
    if (!qz) {
      qz = { id: uid(), type: 'quiz', name: String(raw.name || 'MC-Test').replace(/^MC Kapitel/, 'Kapitel'), groupId: g.id, chapter: ch, sessionSize: 0,
             questions: [], created: Date.now(), updated: Date.now(), lastStudied: null };
      quizzes.push(qz); created++;
    }
    const used = new Set();   // jede vorhandene Frage höchstens einmal zuordnen (gleicher Fragetext kommt mehrfach vor)
    for (const rq of raw.questions || []) {
      const text = String(rq.text || '').trim(); if (!text) continue;
      const answers = (rq.answers || []).map(a => ({ text: String(a.text || ''), correct: !!a.correct, meaning: String(a.meaning || '') })).filter(a => a.text);
      if (!answers.length) continue;
      const sig = text + '|' + answers.map(a => a.text).join('|');
      const ex = qz.questions.find(q => !used.has(q) && q.text + '|' + q.answers.map(a => a.text).join('|') === sig)
        || qz.questions.find(q => !used.has(q) && q.text === text && q.answers.length === answers.length && q.answers.filter((a, i) => a.text === answers[i].text).length >= answers.length / 2);
      if (ex) used.add(ex);
      const p = rq.progress && typeof rq.progress === 'object' ? { ...newQStat(), ...rq.progress } : null;
      if (ex) { if (JSON.stringify(ex.answers) !== JSON.stringify(answers)) { ex.answers = answers; updatedQ++; } if (p) ex.st = p; }
      else { const nq = { id: uid(), text, answers, st: p || newQStat() }; qz.questions.push(nq); used.add(nq); addedQ++; }
    }
    await saveSet(qz);
  }
  const msg = created || addedQ || updatedQ ? `${created} MC-Test${created === 1 ? '' : 's'} angelegt · ${addedQ} Fragen neu${updatedQ ? ` · ${updatedQ} aktualisiert` : ''}` : 'MC-Tests schon aktuell – nichts Neues';
  return { msg, group: firstGroup };
}
// Ältere Version: MC-Tests lagen in normalen Gruppen oder ohne Gruppe → in eigene MC-Gruppe verschieben
async function migrateQuizzes() {
  for (const qz of quizzes) {
    const g = getGroup(qz.groupId);
    if (isMcGroup(g)) continue;
    const target = await findOrCreateGroup(g ? `${g.name} – MC` : 'MC-Tests', 'mc');
    qz.groupId = target.id; if (/^MC Kapitel/.test(qz.name)) qz.name = qz.name.replace(/^MC Kapitel/, 'Kapitel');
    await saveSet(qz);
  }
}

/* ---------------- init ---------------- */
(async function init() {

  catch (e) { app.innerHTML = `<div class="page"><div class="empty">Speicher nicht verfügbar: ${esc(e.message)}</div></div>`; return; }

  // Durchgang, der durch Schließen der App unterbrochen wurde, übernehmen

    if (raw) { const sess = JSON.parse(raw); const out = applySession(sess); if (out) await saveSet(out.set); localStorage.removeItem(SESSION_KEY); }
  } catch {}
  try { await migrateQuizzes(); } catch {}
  render();
  resumeMcSession();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
