<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kartei">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kartei</title>
<style>
:root{
  --bg:#f2f2f7; --surface:#fff; --surface2:#f6f6f9; --text:#16161a; --muted:#6c6c78; --line:#e2e2e9;
  --accent:#4f46e5; --accent-soft:#ecebff; --on-accent:#fff;
  --gray:#cfcfd8; --green:#34c759; --green-dark:#13803a; --orange:#ff9500; --red:#ff3b30;
  --hl:rgba(52,199,89,.30); --hl-text:#0b6b2c;
  --lv0:#bdbdc8; --lv1:#ff3b30; --lv2:#ff9500; --lv3:#a5d63f; --lv4:#34c759; --lv5:#13803a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 24px rgba(0,0,0,.07);
  --radius:18px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0f12; --surface:#1c1c21; --surface2:#25252c; --text:#f2f2f6; --muted:#9a9aa8; --line:#2f2f38;
    --accent:#8b85ff; --accent-soft:#2a2850; --on-accent:#0f0f12;
    --gray:#4a4a55; --green:#30d158; --green-dark:#1fa34a; --orange:#ff9f0a; --red:#ff453a;
    --hl:rgba(48,209,88,.28); --hl-text:#7ef0a0;
    --lv0:#5a5a66; --lv5:#1fa34a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- generic layout ---------- */
.page{padding:calc(var(--sat) + 8px) 16px calc(var(--sab) + 96px);max-width:640px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px;margin-bottom:6px}
.topbar .grow{flex:1;min-width:0}
.big-title{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:6px 0 14px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-size:22px}
.icon-btn:active{background:var(--accent-soft)}
.text-btn{color:var(--accent);font-weight:600;padding:8px 6px}
.back-btn{color:var(--accent);font-size:17px;padding:8px 4px;display:flex;align-items:center;gap:2px}
.back-btn svg{width:22px;height:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-weight:650;font-size:17px;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.4}
.btn:active:not(:disabled){transform:scale(.985)}
.fab{position:fixed;right:20px;bottom:calc(var(--sab) + 20px);width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;display:grid;place-items:center;box-shadow:0 6px 20px rgba(79,70,229,.35);z-index:5}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.section-title{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .emoji{font-size:44px;margin-bottom:8px}

/* ---------- progress ---------- */
.pbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.pbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lv-pill{font-size:12px;font-weight:650;padding:3px 8px;border-radius:99px;white-space:nowrap;color:#fff}
.lv-pill.lv0{background:var(--lv0)}.lv-pill.lv1{background:var(--lv1)}.lv-pill.lv2{background:var(--lv2)}
.lv-pill.lv3{background:var(--lv3);color:#1d2a05}.lv-pill.lv4{background:var(--lv4)}.lv-pill.lv5{background:var(--lv5)}

/* ---------- set list ---------- */
.set-list{display:flex;flex-direction:column;gap:12px}
.set-item{display:block;text-align:left;width:100%}
.set-item:active{transform:scale(.99)}
.set-item .row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.set-item .name{font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-item .pct{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.set-item .meta{font-size:14px;color:var(--muted);margin-bottom:10px}
.due-badge{color:var(--orange);font-weight:650}

/* ---------- set view ---------- */
.set-head .pct-big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.set-head .sub{color:var(--muted);margin:4px 0 14px;font-size:14px}
.learn-box{margin-top:14px}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stepper .ctrl{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:12px;padding:4px}
.stepper .ctrl button{width:38px;height:34px;border-radius:9px;font-size:20px;color:var(--accent);font-weight:600}
.stepper .ctrl button:active{background:var(--accent-soft)}
.stepper .ctrl .val{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.search{width:100%;height:40px;border-radius:12px;border:0;background:var(--surface);padding:0 14px;margin-bottom:10px;font-size:16px;box-shadow:var(--shadow)}
.search:focus{outline:2px solid var(--accent)}
.card-list{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.card-row:last-child{border-bottom:0}
.card-row:active{background:var(--surface2)}
.card-row .txt{flex:1;min-width:0}
.card-row .f{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row .b{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* ---------- session boxes ---------- */
.box{display:inline-block;flex:1 1 0;min-width:10px;max-width:22px;height:13px;border-radius:4px;background:var(--gray);position:relative;transition:background .25s}
.box.st-correct{background:var(--green)}
.box.st-double{background:var(--green-dark);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--green-dark)}
.box.st-ok{background:var(--orange)}
.box.st-wrong{background:var(--red)}
.box.cur::after{content:"";position:absolute;left:15%;right:15%;bottom:-8px;height:3px;border-radius:2px;background:var(--accent)}
.box.mini{flex:none;width:16px;height:11px;min-width:0}
.box.mini.st-double{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--green-dark)}

/* ---------- study ---------- */
.study{min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--sat) + 4px) 16px calc(var(--sab) + 12px);max-width:640px;margin:0 auto}
.st-top{display:flex;align-items:center;gap:8px;min-height:44px}
.st-top .title{flex:1;text-align:center;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-top .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.boxbar{display:flex;gap:6px;overflow-x:auto;padding:8px 6px 14px;scrollbar-width:none;margin:0 -6px}
.boxbar::-webkit-scrollbar{display:none}
.card-stage{flex:1 1 auto;min-height:260px;position:relative;perspective:1400px;margin:4px 0 14px}
.card-drag{position:absolute;inset:0;touch-action:pan-y;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card-drag.anim{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.card3d{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card3d.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:20px;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg)}
.face .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between}
.face .content{font-size:19px;line-height:1.45;overflow-wrap:anywhere}
.face.q .content{margin:auto 0;text-align:center;font-size:21px;font-weight:550}
.face.q .content ul,.face.q .content ol{text-align:left}
.face .divider{height:1px;background:var(--line);margin:18px 0 14px;flex:none}
.face .your{font-size:17px;color:var(--text);opacity:.9;overflow-wrap:anywhere}
.face .tap-hint{margin-top:auto;padding-top:12px;text-align:center;font-size:12px;color:var(--muted)}
.content img,.rte img{max-width:100%;height:auto;border-radius:10px;display:block;margin:8px auto}
.content ul,.content ol,.rte ul,.rte ol{margin:6px 0;padding-left:24px}
.hl{background:var(--hl);border-radius:4px;padding:0 2px;color:inherit;box-shadow:inset 0 -2px 0 var(--green)}
.swipe-tag{position:absolute;top:18px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:18px;opacity:0;pointer-events:none;z-index:3;border:3px solid}
.swipe-tag.left{right:18px;color:var(--red);border-color:var(--red);transform:rotate(10deg)}
.swipe-tag.right{left:18px;color:var(--green);border-color:var(--green);transform:rotate(-10deg)}
.answer-area{display:flex;flex-direction:column;gap:10px}
.answer-area textarea{width:100%;min-height:92px;max-height:30dvh;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:14px;font-size:17px;resize:none}
.answer-area textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.swipe-help{text-align:center;font-size:12px;color:var(--muted)}
.rate-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate-bar button{height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px}
.rate-bar .em{font-size:30px;line-height:1}
.rate-bar .wrong{background:color-mix(in srgb,var(--red) 14%,var(--surface));color:var(--red)}
.rate-bar .ok{background:color-mix(in srgb,var(--orange) 16%,var(--surface));color:var(--orange)}
.rate-bar .right{background:color-mix(in srgb,var(--green) 16%,var(--surface));color:var(--green-dark)}
.rate-bar button:active{transform:scale(.96)}
@media (prefers-color-scheme: dark){.rate-bar .right{color:var(--green)}}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.done .emoji{font-size:64px}
.done h2{margin:0;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:var(--surface);border-radius:14px;padding:12px 6px;box-shadow:var(--shadow)}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--muted)}

/* ---------- modal / sheets ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.overlay.center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:10px 12px calc(var(--sab) + 12px);animation:up .22s}
.sheet h3{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin:8px 0 10px}
.sheet .group{background:var(--surface);border-radius:14px;overflow:hidden;margin-bottom:10px}
.sheet .group button{display:block;width:100%;padding:16px;text-align:center;font-size:17px;color:var(--accent);border-bottom:1px solid var(--line)}
.sheet .group button:last-child{border-bottom:0}
.sheet .group button.danger{color:var(--red)}
.sheet .group button:active{background:var(--surface2)}
.sheet .cancel{font-weight:650}
.dialog{background:var(--surface);border-radius:20px;width:100%;max-width:380px;padding:20px;animation:up .2s}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog p{margin:0 0 14px;color:var(--muted);font-size:15px;white-space:pre-line}
.dialog input,.dialog textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;font-size:16px;margin-bottom:12px}
.dialog textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.dialog .btns{display:flex;gap:10px}
.dialog .btns button{flex:1;height:46px;border-radius:12px;font-weight:650;background:var(--surface2);color:var(--accent)}
.dialog .btns button.primary{background:var(--accent);color:var(--on-accent)}
.dialog .btns button.danger{background:var(--red);color:#fff}

/* ---------- editor ---------- */
.editor{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:up .22s}
.editor .bar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 4px) 10px 4px;min-height:48px}
.editor .bar .title{font-weight:650}
.editor .scroll{flex:1;overflow:auto;padding:6px 16px calc(var(--sab) + 30px)}
.editor label{display:block;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 6px}
.rte{min-height:110px;background:var(--surface);border-radius:16px;padding:14px;font-size:17px;line-height:1.45;box-shadow:var(--shadow);overflow-wrap:anywhere}
.rte:focus{outline:2px solid var(--accent)}
.rte.empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none;position:absolute}
.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:4px;background:var(--bg);padding:6px 0;overflow-x:auto}
.toolbar button{white-space:nowrap;flex:none;min-width:42px;height:38px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:16px;padding:0 10px}
.toolbar button:active{background:var(--accent-soft)}
.editor .del{margin-top:28px;color:var(--red);background:var(--surface);}
.editor .meta-line{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:100;max-width:90vw;text-align:center;animation:up .2s}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file-import" accept=".json,.txt,.md,.csv,.tsv,application/json,text/plain" class="hidden">
<input type="file" id="file-image" accept="image/*" class="hidden">
<script>
"use strict";
/* =========================================================
   Kartei – Karteikarten-Lern-App (PWA)
   ========================================================= */
const DAY = 86400000;
const LEVELS = ['Neu','Schlecht','OK','Gut','Sehr gut','Perfekt'];
const PROGRESS_KEYS = ['level','due','reviews','nCorrect','nWrong','lastSession','lastReviewed','perfectStreak'];
const SESSION_KEY = 'kartei-open-session';

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const app = $('#app');

/* ---------------- storage (IndexedDB) ---------------- */
const Store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('kartei', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('sets', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode) { return this.db.transaction('sets', mode).objectStore('sets'); },
  all() { return new Promise((res, rej) => { const q = this.tx('readonly').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  put(set) { return new Promise((res, rej) => { const q = this.tx('readwrite').put(set); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  del(id) { return new Promise((res, rej) => { const q = this.tx('readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
};
let sets = [];
const getSet = id => sets.find(s => s.id === id);
async function saveSet(set) {
  set.updated = Date.now();
  try { await Store.put(set); } catch (e) { toast('Speichern fehlgeschlagen: ' + e.message); }
}

function newCard(front, back) {
  return { id: uid(), front, back, level: 0, due: null, reviews: 0, nCorrect: 0, nWrong: 0,
           lastSession: null, lastReviewed: null, perfectStreak: 0, created: Date.now() };
}
function newSet(name) {
  return { id: uid(), name: name || 'Neues Set', sessionSize: 10, cards: [], created: Date.now(), updated: Date.now(), lastStudied: null };
}
function resetProgress(c) {
  Object.assign(c, { level: 0, due: null, reviews: 0, nCorrect: 0, nWrong: 0, lastSession: null, lastReviewed: null, perfectStreak: 0 });
}

/* ---------------- learning system ----------------
   Stufen: 0 Neu · 1 Schlecht · 2 OK · 3 Gut · 4 Sehr gut · 5 Perfekt
   Wiederholungsintervall (Tage): Schlecht 0 · OK 1 · Gut 3 · Sehr gut 7 ·
   Perfekt 14 → 28 → 56 → … (max 180), je öfter fehlerfrei.            */
function intervalDays(c) {
  switch (c.level) {
    case 1: return 0;
    case 2: return 1;
    case 3: return 3;
    case 4: return 7;
    case 5: return Math.min(180, 14 * Math.pow(2, Math.max(0, (c.perfectStreak || 1) - 1)));
    default: return 0;
  }
}
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const isDue = (c, now = Date.now()) => c.level > 0 && (c.due == null || c.due <= now);

// Kartenauswahl: fällige & schwache Karten bevorzugt, gute seltener (nie ausgeschlossen)
const LEVEL_WEIGHT = [4, 6, 4, 2, 1.2, 0.6];
function pickCards(cards, n) {
  const now = Date.now();
  const keyed = cards.map(c => {
    let w = LEVEL_WEIGHT[c.level] ?? 1;
    if (isDue(c, now)) w *= 3;
    return { c, k: Math.pow(Math.random(), 1 / w) };
  });
  keyed.sort((a, b) => b.k - a.k);
  return shuffle(keyed.slice(0, n).map(x => x.c));
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function setStats(set) {
  const counts = [0, 0, 0, 0, 0, 0];
  let due = 0; const now = Date.now();
  for (const c of set.cards) { counts[c.level] = (counts[c.level] || 0) + 1; if (isDue(c, now)) due++; }
  const n = set.cards.length;
  const pct = n ? Math.round(set.cards.reduce((s, c) => s + c.level, 0) / (n * 5) * 100) : 0;
  return { counts, due, n, pct, newCount: counts[0] };
}
function pbarHtml(counts, n) {
  if (!n) return '<div class="pbar"></div>';
  // reihenfolge: perfekt → neu, damit der "gute" teil links wächst
  return '<div class="pbar">' + [5, 4, 3, 2, 1, 0].map(l => counts[l] ? `<span style="width:${counts[l] / n * 100}%;background:var(--lv${l})"></span>` : '').join('') + '</div>';
}

/* ---------------- html helpers ---------------- */
const ALLOWED = new Set(['B','STRONG','I','EM','U','BR','P','DIV','UL','OL','LI','IMG','SUB','SUP','SPAN']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','META','LINK','TITLE','HEAD','svg','SVG','TEMPLATE','NOSCRIPT']);
function sanitize(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  (function clean(node) {
    for (const ch of [...node.childNodes]) {
      if (ch.nodeType === 3) continue;
      if (ch.nodeType !== 1) { ch.remove(); continue; }
      const tag = ch.tagName;
      if (DROP.has(tag)) { ch.remove(); continue; }
      if (!ALLOWED.has(tag)) { clean(ch); ch.replaceWith(...ch.childNodes); continue; }
      const src = tag === 'IMG' ? ch.getAttribute('src') : null;
      const st = (ch.getAttribute('style') || '').toLowerCase();
      for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
      if (tag === 'IMG') { if (src && /^data:image\/(png|jpe?g|gif|webp);base64,/i.test(src)) ch.setAttribute('src', src); else ch.remove(); continue; }
      if (tag === 'SPAN') {
        // Formatierung aus eingefügten Texten (style) in Tags umwandeln
        clean(ch);
        let inner = [...ch.childNodes];
        let wrap = null;
        const mk = t => { const e = doc.createElement(t); if (wrap) e.append(wrap); else e.append(...inner); wrap = e; };
        if (/font-weight:\s*(bold|[6-9]00)/.test(st)) mk('B');
        if (/font-style:\s*italic/.test(st)) mk('I');
        if (/text-decoration[^;]*underline/.test(st)) mk('U');
        if (wrap) ch.replaceWith(wrap); else ch.replaceWith(...inner);
        continue;
      }
      clean(ch);
    }
  })(doc.body);
  return doc.body.innerHTML.replace(/^(\s|<br>)+|(\s|<br>)+$/g, '');
}
function plainText(html) {
  const d = document.createElement('div');
  d.innerHTML = (html || '').replace(/<img[^>]*>/gi, ' 🖼 ').replace(/<(br|\/p|\/div|\/li)>/gi, ' $&');
  return d.textContent.replace(/\s+/g, ' ').trim();
}
function isEmptyHtml(html) { return !plainText(html) && !/<img/i.test(html || ''); }
function textToHtml(t) { return esc(t).replace(/\n/g, '<br>'); }

// Wörter der Musterlösung, die auch in der Antwort vorkommen, grün markieren
const WORD_RE = /[\p{L}\p{N}]+(?:[-'’][\p{L}\p{N}]+)*/gu;
const normWord = w => w.toLocaleLowerCase('de').normalize('NFC');
function highlightHtml(html, answer) {
  const words = new Set((answer.match(WORD_RE) || []).map(normWord));
  if (!words.size) return html;
  const div = document.createElement('div');
  div.innerHTML = html;
  const walker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const t of nodes) {
    const s = t.nodeValue; let last = 0, any = false; const frag = document.createDocumentFragment();
    for (const m of s.matchAll(WORD_RE)) {
      if (!words.has(normWord(m[0]))) continue;
      any = true;
      frag.append(s.slice(last, m.index));
      const sp = document.createElement('span'); sp.className = 'hl'; sp.textContent = m[0]; frag.append(sp);
      last = m.index + m[0].length;
    }
    if (any) { frag.append(s.slice(last)); t.replaceWith(frag); }
  }
  return div.innerHTML;
}

/* ---------------- UI helpers ---------------- */
function toast(msg, ms = 2400) {

}
function sheet(title, items) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="sheet">${title ? `<h3>${esc(title)}</h3>` : ''}
      <div class="group">${items.map((it, i) => `<button data-i="${i}" class="${it.danger ? 'danger' : ''}">${esc(it.label)}</button>`).join('')}</div>
      <div class="group"><button class="cancel" data-i="-1">Abbrechen</button></div></div>`;
    const close = v => { ov.remove(); resolve(v); };
    ov.addEventListener('click', e => {

      if (b) { const i = +b.dataset.i; close(i); if (i >= 0 && items[i].action) items[i].action(); }
      else if (e.target === ov) close(-1);
    });
    document.body.append(ov);

}
function dialog({ title, message = '', input = null, textarea = null, buttons = [{ label: 'OK', value: true, kind: 'primary' }] }) {
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'overlay center';

      <div class="btns">${buttons.map((b, i) => `<button data-i="${i}" class="${b.kind || ''}">${esc(b.label)}</button>`).join('')}</div></div>`;

let lastRange = null, lastEditor = null;

function openEditor(set, card, onDone) {

                 <div class="meta-line">Stufe: ${LEVELS[card.level]} · ${card.reviews}× gelernt${card.due && card.level ? ` · fällig ${new Date(card.due).toLocaleDateString('de-AT')}` : ''}</div>`}
    </div>`;
  document.body.append(el);

  const front = $('#ed-front', el), back = $('#ed-back', el);
  const updEmpty = ed => ed.classList.toggle('empty', isEmptyHtml(ed.innerHTML));

    updEmpty(ed);

    ed.addEventListener('paste', e => {
      const html = e.clipboardData.getData('text/html'); const txt = e.clipboardData.getData('text/plain');

function pickImage(ed) {
  const inp = $('#file-image');
  const range = lastRange && ed.contains(lastRange.startContainer) ? lastRange.cloneRange() : null;
  inp.value = '';
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    try {
      const url = await resizeImage(file, 1200);
      const img = document.createElement('img'); img.src = url;
      ed.focus();
      const sel = getSelection();
      let r = range;
      if (!r) { r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); }
      r.deleteContents(); r.insertNode(img);
      r.setStartAfter(img); r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
      ed.classList.remove('empty');
    } catch (err) { toast('Bild konnte nicht geladen werden'); }
  };
  inp.click();
}
function resizeImage(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img; const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

/* ---------------- STUDY SESSION ----------------
   queue: Reihenfolge der Kästchen; pos: aktuelle Position.
   Alles links von pos ist „doppelt richtig“ (fertig).
   st: new (grau) · correct (grün) · double (dunkelgrün + Rahmen) · ok (orange) · wrong (rot) */
let S = null;
function startStudy(set) {
  const n = Math.min(set.sessionSize || 10, set.cards.length);
  if (!n) return;
  const chosen = pickCards(set.cards, n);
  S = { setId: set.id, queue: chosen.map(c => ({ id: c.id, st: 'new' })), pos: 0, meta: {},
        phase: 'question', flipped: false, answer: '', started: Date.now(), ratings: 0, done: false };
  persistSession();
  go({ name: 'study' });
}
function persistSession() { try { if (S && !S.done) localStorage.setItem(SESSION_KEY, JSON.stringify({ setId: S.setId, queue: S.queue, meta: S.meta })); else localStorage.removeItem(SESSION_KEY); } catch {} }
const curItem = () => S.queue[S.pos];
const curCard = () => { const set = getSet(S.setId); return set && set.cards.find(c => c.id === curItem().id); };

function renderStudy() {
  const set = getSet(S?.setId);
  if (!S || !set) return go({ name: 'home' });
  if (S.done) return renderDone(set);
  // Karte könnte inzwischen gelöscht worden sein
  while (S.pos < S.queue.length && !set.cards.find(c => c.id === S.queue[S.pos].id)) S.queue.splice(S.pos, 1);
  if (S.pos >= S.queue.length) return finishSession(true);
  const card = curCard();
  const doneCount = S.queue.filter(x => x.st === 'double').length;
  app.innerHTML = `<div class="study">
    <div class="st-top">

    </div>

    <div class="card-stage"><div class="card-drag" id="drag">
      <div class="swipe-tag left" id="tag-l">😞 Falsch</div><div class="swipe-tag right" id="tag-r">😊 Richtig</div>
      <div class="card3d${S.flipped ? ' flipped' : ''}" id="card3d">${faceHtml(card)}</div>
    </div></div>
    ${S.phase === 'question'
      ? `<div class="answer-area"><textarea id="answer" placeholder="Deine Antwort…" rows="3">${esc(S.answer)}</textarea>
         <button class="btn primary" data-a="submit">Abgeben</button>
         <div class="swipe-help">Karte antippen zum Umdrehen · ← falsch · richtig →</div></div>`
      : `<div class="rate-bar">
          <button class="wrong" data-a="rate" data-k="wrong"><span class="em">😞</span>Falsch</button>
          <button class="ok" data-a="rate" data-k="ok"><span class="em">😐</span>OK</button>
          <button class="right" data-a="rate" data-k="correct"><span class="em">😊</span>Richtig</button></div>`}

  const bar = $('#boxbar'); const cur = $('.box.cur', bar);
  if (cur) bar.scrollLeft = Math.max(0, cur.offsetLeft - bar.clientWidth / 2);
  const ta = $('#answer'); if (ta) ta.oninput = () => { S.answer = ta.value; };
  setupSwipe();
  app.onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'submit') { S.answer = ta.value; S.phase = 'answered'; S.flipped = false; renderStudy(); }
    else if (a === 'rate') rate(b.dataset.k);
    else if (a === 'quit') {
      if (!S.ratings) { S = null; persistSession(); localStorage.removeItem(SESSION_KEY); return go({ name: 'set', id: set.id }); }
      if (await confirmBox('Durchgang beenden?', 'Die Stände der bereits bewerteten Karten werden gespeichert.', 'Beenden')) finishSession(false);
    }
    else if (a === 'editcard') openEditor(set, card, renderStudy);
  };
}
function faceHtml(card) {
  const q = `<div class="tag"><span>Frage</span></div><div class="content">${card.front}</div>`;
  const ans = `<div class="tag"><span>Antwort</span></div><div class="content">${card.back}</div>`;
  if (S.phase === 'question') {
    return `<div class="face front q">${q}<div class="tap-hint">Tippen zum Umdrehen</div></div>
            <div class="face back">${ans}<div class="tap-hint">Tippen zum Zurückdrehen</div></div>`;
  }
  const hl = highlightHtml(card.back, S.answer);
  return `<div class="face front"><div class="tag"><span>Musterlösung</span></div><div class="content">${hl}</div>
            <div class="divider"></div>
            <div class="tag"><span>Deine Antwort</span></div><div class="your">${S.answer.trim() ? textToHtml(S.answer) : '<i class="muted">– keine Antwort –</i>'}</div>
            <div class="tap-hint">Tippen für die Frage</div></div>
          <div class="face back q">${q}</div>`;
}
function setupSwipe() {
  const drag = $('#drag'), c3 = $('#card3d'), tl = $('#tag-l'), tr = $('#tag-r');
  let x0, y0, t0, dx = 0, dragging = false, active = false, pid = null;
  drag.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    active = true; dragging = false; x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); dx = 0; pid = e.pointerId;
    drag.classList.remove('anim');
  });
  drag.addEventListener('pointermove', e => {
    if (!active || e.pointerId !== pid) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (!dragging && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) { dragging = true; try { drag.setPointerCapture(pid); } catch {} }
    if (dragging) {
      e.preventDefault();
      drag.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      tr.style.opacity = Math.max(0, Math.min(1, dx / 90));
      tl.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    }
  });
  const end = e => {
    if (!active || (e && e.pointerId !== pid)) return;
    active = false;
    if (dragging) {
      const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
      if (Math.abs(dx) > 95 || (v > 0.6 && Math.abs(dx) > 40)) { rate(dx > 0 ? 'correct' : 'wrong'); return; }
      drag.classList.add('anim'); drag.style.transform = ''; tl.style.opacity = tr.style.opacity = 0;
    } else if (e && e.type === 'pointerup' && Math.abs(e.clientX - x0) < 8 && Math.abs(e.clientY - y0) < 8) {
      S.flipped = !S.flipped; c3.classList.toggle('flipped', S.flipped);
    }
  };
  drag.addEventListener('pointerup', end);
  drag.addEventListener('pointercancel', () => { if (!active) return; active = false; drag.classList.add('anim'); drag.style.transform = ''; tl.style.opacity = tr.style.opacity = 0; });
}
let rating = false;
function rate(kind) {
  if (rating || !S || S.done) return;
  rating = true;
  const it = curItem();
  const m = S.meta[it.id] || (S.meta[it.id] = {});
  m.touched = true; S.ratings++;
  if (kind === 'wrong') {
    m.hadWrong = true; it.st = 'wrong';
    const k = Math.min(3, S.queue.length - 1 - S.pos);
    S.queue.splice(S.pos, 1); S.queue.splice(S.pos + k, 0, it);
  } else if (kind === 'ok') {
    m.hadOk = true; it.st = 'ok';
    S.queue.splice(S.pos, 1); S.queue.push(it);
  } else if (it.st === 'correct') {
    it.st = 'double'; S.pos++;               // bleibt stehen, Position rückt weiter
  } else {
    it.st = 'correct';                        // neu / falsch / ok → richtig, ans Ende
    S.queue.splice(S.pos, 1); S.queue.push(it);
  }
  persistSession();
  // Animation
  const drag = $('#drag');
  const next = () => {
    rating = false;
    S.phase = 'question'; S.flipped = false; S.answer = '';
    if (S.pos >= S.queue.length) finishSession(true); else renderStudy();
  };
  if (drag) {
    drag.classList.add('anim');
    const dir = kind === 'wrong' ? -1 : kind === 'correct' ? 1 : 0;
    drag.style.transform = dir ? `translateX(${dir * 140}%) rotate(${dir * 18}deg)` : 'translateY(30%) scale(.9)';
    drag.style.opacity = '0';
    $('#tag-l').style.opacity = kind === 'wrong' ? 1 : 0; $('#tag-r').style.opacity = kind === 'correct' ? 1 : 0;
    setTimeout(next, 240);
  } else next();
}

// Ergebnisse eines (abgeschlossenen oder abgebrochenen) Durchgangs in die Karten übernehmen
function applySession(sess) {
  const set = getSet(sess.setId); if (!set) return null;
  const now = Date.now(); const res = { wrong: 0, perfect: 0, up: 0, down: 0, touched: 0 };
  for (const it of sess.queue) {
    const m = sess.meta[it.id]; if (!m || !m.touched) continue;
    const c = set.cards.find(x => x.id === it.id); if (!c) continue;
    res.touched++;
    const before = c.level; let lv = c.level, changed = false;
    c.reviews = (c.reviews || 0) + 1; c.lastReviewed = now; c.lastSession = it.st;
    if (m.hadWrong) {
      res.wrong++; c.nWrong = (c.nWrong || 0) + 1;
      lv = lv <= 1 ? 1 : lv - 1; c.perfectStreak = 0; changed = true;
    } else if (it.st === 'double') {
      c.nCorrect = (c.nCorrect || 0) + 1; changed = true;
      if (!m.hadOk) res.perfect++;
      if (lv === 0) lv = m.hadOk ? 2 : 3;
      else if (m.hadOk) lv = Math.max(lv, 2);
      else if (lv < 5) { lv++; if (lv === 5) c.perfectStreak = 1; }
      else c.perfectStreak = (c.perfectStreak || 1) + 1;
    } else if (lv === 0) { lv = 2; changed = true; }  // angefangen, aber nicht fertig
    c.level = lv;
    if (changed || c.due == null) c.due = startOfDay(now) + intervalDays(c) * DAY;
    if (lv > before && !m.hadWrong) res.up++; else if (lv < before) res.down++;
  }
  set.lastStudied = now;
  return { set, res };
}
async function finishSession(completed) {
  if (!S) return;
  const out = applySession(S);
  S.done = true; persistSession(); localStorage.removeItem(SESSION_KEY);
  if (out) await saveSet(out.set);
  if (!completed) { const id = S.setId; S = null; toast('Fortschritt gespeichert'); return go({ name: 'set', id }); }
  S.result = out ? out.res : null; S.time = Date.now() - S.started;
  renderStudy();
}
function renderDone(set) {
  const r = S.result || { touched: 0, wrong: 0, perfect: 0, up: 0 };
  const min = Math.max(1, Math.round(S.time / 60000));
  const st = setStats(set);
  app.innerHTML = `<div class="study"><div class="done">
      <div class="emoji">🎉</div><h2>Geschafft!</h2>
      <div class="muted">Alle ${S.queue.length} Karten doppelt richtig · ${min} Min.</div>
      <div class="stats"><div><b>${r.perfect}</b><span>ohne Fehler</span></div><div><b>${r.wrong}</b><span>mit Fehlern</span></div><div><b>${r.up}</b><span>Stufe ↑</span></div></div>
      <div class="panel" style="text-align:left"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>${esc(set.name)}</b><b style="color:var(--accent)">${st.pct}%</b></div>${pbarHtml(st.counts, st.n)}</div>
      <div style="height:10px"></div>
      <button class="btn primary" data-a="again">Weiterlernen</button>
      <button class="btn secondary" data-a="back">Zurück zum Set</button>
    </div></div>`;
  app.onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    S = null;
    if (b.dataset.a === 'again') startStudy(set); else go({ name: 'set', id: set.id });
  };
}

/* ---------------- IMPORT / EXPORT ----------------
   Eigenes Format „Kartei“ (.kartei.json):
   { "format":"kartei", "version":1, "includesProgress":true|false,
     "sets":[ { "name":"…", "sessionSize":10,
                "cards":[ { "front":"<html>", "back":"<html>", "progress":{…optional…} } ] } ] }
   Text-Format (.txt) zum schnellen Erstellen siehe Anleitung. */
function exportSets(list, withProgress, baseName) {
  const data = {
    format: 'kartei', version: 1, exported: new Date().toISOString(), includesProgress: withProgress,
    sets: list.map(s => ({ name: s.name, sessionSize: s.sessionSize, cards: s.cards.map(c => {
      const o = { front: c.front, back: c.back };
      if (withProgress) { o.progress = {}; PROGRESS_KEYS.forEach(k => o.progress[k] = c[k] ?? null); }
      return o;
    }) }))
  };
  const name = (baseName || list[0].name).replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60) + (withProgress ? '' : ' (ohne Fortschritt)') + '.kartei.json';
  shareOrDownload(name, JSON.stringify(data));
}
async function shareOrDownload(name, text) {
  const file = new File([text], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function mdToHtml(src) {
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>').replace(/\^\((.+?)\)/g, '<sup>$1</sup>').replace(/_\((.+?)\)/g, '<sub>$1</sub>');
  const lines = src.replace(/\r/g, '').split('\n');
  const blocks = []; let list = null, para = [];
  const flushPara = () => { if (para.length) { blocks.push({ t: 'p', h: para.join('<br>') }); para = []; } };
  const closeList = () => { if (list) { blocks.push({ t: 'l', h: `<${list.tag}>${list.items.join('')}</${list.tag}>` }); list = null; } };
  for (const ln of lines) {
    let m;
    const ul = ln.match(/^\s*[-•*]\s+(.*)$/), ol = !ul && ln.match(/^\s*\d+[.)]\s+(.*)$/);
    if ((m = ul || ol)) {
      flushPara(); const tag = ul ? 'ul' : 'ol';
      if (!list || list.tag !== tag) { closeList(); list = { tag, items: [] }; }
      list.items.push(`<li>${inline(m[1])}</li>`);
    } else { closeList(); if (ln.trim() === '') flushPara(); else para.push(inline(ln)); }
  }
  flushPara(); closeList();
  // zwei Absätze hintereinander durch Leerzeile trennen, Listen direkt anfügen
  return blocks.map((b, i) => (i && b.t === 'p' && blocks[i - 1].t === 'p' ? '<br><br>' : '') + b.h).join('');
}
function parseText(txt, fallbackName) {
  txt = txt.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
  let name = null;
  const hm = txt.match(/^\s*#\s+(.+)\n/);
  if (hm) { name = hm[1].trim(); txt = txt.slice(hm[0].length); }
  const cards = []; let skipped = 0;
  if (/^[ \t]*(===|---)[ \t]*$/m.test(txt)) {
    for (const block of txt.split(/^[ \t]*===[ \t]*$/m)) {
      if (!block.trim()) continue;
      const parts = block.split(/^[ \t]*---[ \t]*$/m);
      if (parts.length < 2 || !parts[0].trim() || !parts.slice(1).join('').trim()) { skipped++; continue; }
      cards.push({ front: mdToHtml(parts[0].trim()), back: mdToHtml(parts.slice(1).join('\n---\n').trim()) });
    }
  } else {
    for (const ln of txt.split('\n')) {
      if (!ln.trim()) continue;
      const sep = ln.includes('\t') ? '\t' : ln.includes(';;') ? ';;' : ln.includes(' :: ') ? ' :: ' : null;
      if (!sep) { skipped++; continue; }
      const i = ln.indexOf(sep); const f = ln.slice(0, i).trim(), b = ln.slice(i + sep.length).trim();
      if (!f || !b) { skipped++; continue; }
      cards.push({ front: mdToHtml(f), back: mdToHtml(b.replace(/\\n/g, '\n')) });
    }
  }
  return { sets: [{ name: name || fallbackName || 'Importiertes Set', cards }], skipped };
}
function parseJson(txt, fallbackName) {
  const d = JSON.parse(txt.replace(/^﻿/, ''));
  let rawSets;
  if (Array.isArray(d)) rawSets = [{ name: fallbackName, cards: d }];
  else if (Array.isArray(d.sets)) rawSets = d.sets;
  else if (Array.isArray(d.cards)) rawSets = [d];
  else throw new Error('Unbekanntes Format');
  let skipped = 0;
  const sets = rawSets.map(s => ({
    name: String(s.name || fallbackName || 'Importiertes Set'), sessionSize: +s.sessionSize || 10,
    cards: (s.cards || []).map(c => {
      const f = sanitize(String(c.front ?? c.question ?? c.frage ?? '')), b = sanitize(String(c.back ?? c.answer ?? c.antwort ?? ''));
      if (isEmptyHtml(f) || isEmptyHtml(b)) { skipped++; return null; }
      return { front: f, back: b, progress: c.progress || null };
    }).filter(Boolean)
  }));
  return { sets, skipped };
}
function buildCard(raw) {
  const c = newCard(raw.front, raw.back);
  const p = raw.progress;
  if (p && typeof p === 'object') {
    const lv = +p.level; if (lv >= 0 && lv <= 5) c.level = Math.floor(lv);
    for (const k of ['due', 'reviews', 'nCorrect', 'nWrong', 'lastReviewed', 'perfectStreak']) if (typeof p[k] === 'number') c[k] = p[k];
    if (['correct', 'double', 'ok', 'wrong'].includes(p.lastSession)) c.lastSession = p.lastSession;
  }
  return c;
}
function importFlow(target) {
  sheet(target ? `Karten in „${target.name}“ importieren` : 'Importieren', [
    { label: 'Datei auswählen (.json / .txt)', action: () => {
      const inp = $('#file-import'); inp.value = '';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return;
        const txt = await f.text();
        const base = f.name.replace(/\.(kartei\.)?(json|txt|md|csv|tsv)$/i, '').replace(/ \(ohne Fortschritt\)$/, '');
        doImport(txt, base, target, /\.json$/i.test(f.name) || /^\s*[\[{]/.test(txt));
      };
      inp.click();
    } },
    { label: 'Text einfügen', action: async () => {
      const r = await dialog({ title: 'Text einfügen', message: 'Format: Frage, dann eine Zeile ---, dann die Antwort. Karten mit einer Zeile === trennen.',
        textarea: { placeholder: 'Opportunitätskosten\n---\nEntgangener Nutzen der nächstbesten Alternative\n===\nInflation\n---\nAnstieg des allgemeinen Preisniveaus' },
        buttons: [{ label: 'Abbrechen', value: false }, { label: 'Importieren', value: true, kind: 'primary' }] });
      if (r.value && r.text.trim()) doImport(r.text, null, target, /^\s*[\[{]/.test(r.text));
    } },
    { label: 'Formatbeschreibung anzeigen', action: showFormatHelp },
  ]);
}
async function doImport(txt, baseName, target, asJson) {
  let parsed;
  try { parsed = asJson ? parseJson(txt, baseName) : parseText(txt, baseName); }
  catch (e) { return dialog({ title: 'Import fehlgeschlagen', message: 'Die Datei konnte nicht gelesen werden.\n' + e.message }); }
  const total = parsed.sets.reduce((n, s) => n + s.cards.length, 0);
  if (!total) return dialog({ title: 'Keine Karten gefunden', message: 'Bitte prüfe das Format (⋯ → Importieren → Formatbeschreibung).' });
  const skippedMsg = parsed.skipped ? ` (${parsed.skipped} übersprungen)` : '';
  if (target) {
    parsed.sets.forEach(s => s.cards.forEach(c => target.cards.push(buildCard(c))));
    await saveSet(target); renderSet();
    toast(`${total} Karten importiert${skippedMsg}`);
  } else {
    let last;
    for (const s of parsed.sets) {
      const ns = newSet(s.name); ns.sessionSize = s.sessionSize || 10;
      ns.cards = s.cards.map(buildCard); sets.push(ns); await saveSet(ns); last = ns;
    }
    toast(`${parsed.sets.length > 1 ? parsed.sets.length + ' Sets, ' : ''}${total} Karten importiert${skippedMsg}`);
    if (parsed.sets.length === 1) go({ name: 'set', id: last.id }); else render();
  }
}
function showFormatHelp() {
  dialog({ title: 'Import-Formate', message:
`1) Kartei-Datei (.kartei.json)
Entsteht beim Exportieren – mit oder ohne Fortschritt. Enthält Formatierung und Bilder.

2) Text (.txt oder einfügen)
# Name des Sets   (optional, 1. Zeile)
Frage
---
Antwort (mehrzeilig möglich)
===
Nächste Frage
---
Nächste Antwort

Formatierung: **fett**, *kursiv*, __unterstrichen__, Zeilen mit „- “ = Liste, „1. “ = nummerierte Liste.

3) Eine Karte pro Zeile
Frage ⇥ Antwort   (Tabulator, z. B. aus Excel)
oder  Frage ;; Antwort` });
}

/* ---------------- init ---------------- */
(async function init() {
  try { await Store.open(); sets = await Store.all(); }
  catch (e) { app.innerHTML = `<div class="page"><div class="empty">Speicher nicht verfügbar: ${esc(e.message)}</div></div>`; return; }
  // Daten bei Speicherdruck möglichst nicht löschen lassen
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  // Durchgang, der durch Schließen der App unterbrochen wurde, übernehmen
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) { const sess = JSON.parse(raw); const out = applySession(sess); if (out) await saveSet(out.set); localStorage.removeItem(SESSION_KEY); }
  } catch {}
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
